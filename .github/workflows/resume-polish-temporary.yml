name: Apply resume polish patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-polish-temporary.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply resume polish patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch resume UX and score access
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source not found in {path}: {old[:120]}')
              path.write_text(text.replace(old, new, 1))

          # AI status exposes the temporary payment gate.
          path = Path('backend/src/ai/ai.service.ts')
          replace_once(path,
          """    const apiKey = provider
      ? (
          (await this.settingsService.getValue(`${provider}_API_KEY`)) ||
          process.env[`${provider}_API_KEY`] ||
          ''
        ).trim()
      : '';

    return {
      enabled: enabled && Boolean(provider && model && apiKey),
      provider: enabled && provider ? provider : null,
      model: enabled && model ? model : null,
    };
  }
""",
          """    const apiKey = provider
      ? (
          (await this.settingsService.getValue(`${provider}_API_KEY`)) ||
          process.env[`${provider}_API_KEY`] ||
          ''
        ).trim()
      : '';
    const resumeScorePaymentRequired =
      (await this.settingsService.getValue(
        'RESUME_SCORE_PAYMENT_REQUIRED',
        'false',
      )) === 'true';

    return {
      enabled: enabled && Boolean(provider && model && apiKey),
      provider: enabled && provider ? provider : null,
      model: enabled && model ? model : null,
      resumeScorePaymentRequired,
    };
  }

  async isResumeScorePaymentRequired(): Promise<boolean> {
    return (
      (await this.settingsService.getValue(
        'RESUME_SCORE_PAYMENT_REQUIRED',
        'false',
      )) === 'true'
    );
  }
""")

          # Resume score endpoint remains entitlement-aware, but is free while payment gate is off.
          path = Path('backend/src/ai/ai.controller.ts')
          replace_once(path,
          """    if (!user?.resumeScoreUnlocked) {
      throw new ForbiddenException(
        'A pontuação detalhada do currículo é um recurso premium e ainda não está desbloqueada para esta conta.',
      );
    }

    const analysis = await this.resumeReviewService.review(body.profile);
""",
          """    if (!user) {
      throw new ForbiddenException('Perfil de usuário não encontrado.');
    }

    const paymentRequired = await this.aiService.isResumeScorePaymentRequired();
    if (paymentRequired && !user.resumeScoreUnlocked) {
      throw new ForbiddenException(
