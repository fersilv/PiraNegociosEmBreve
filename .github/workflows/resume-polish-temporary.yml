          # Resume builder: non-destructive automatic photo polish + temporary free score reveal.
          path = Path('pages/ResumeBuilderPage.tsx')
          replace_once(path,
          """function mergeUniqueStrings(current: string[], incoming: unknown): string[] {
""",
          """function enhanceProfessionalPhoto(dataUrl: string): Promise<string> {
  return new Promise((resolve) => {
    if (!dataUrl.startsWith("data:image/")) {
      resolve(dataUrl);
      return;
    }

    const image = new Image();
    image.onload = () => {
      const maxDimension = 1400;
      const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      if (!context) {
        resolve(dataUrl);
        return;
      }

      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.filter = "brightness(1.05) contrast(1.06) saturate(0.96)";
      context.drawImage(image, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.9));
    };
    image.onerror = () => resolve(dataUrl);
    image.src = dataUrl;
  });
}

function mergeUniqueStrings(current: string[], incoming: unknown): string[] {
""")
