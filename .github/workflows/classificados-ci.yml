name: Classificados CI

on:
  push:
    branches:
      - classificados
  pull_request:
    branches:
      - pagamentos
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone branch
        run: git clone --depth=1 --branch classificados https://github.com/fersilv/PiraNegociosEmBreve.git repo
      - name: Environment
        run: node --version && npm --version
      - name: Frontend build
        working-directory: repo
        run: npm install && npm run build
      - name: Backend build
        working-directory: repo/backend
        run: npm install && npm run build
