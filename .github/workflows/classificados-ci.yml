name: Classificados CI

on:
  push:
    branches:
      - main
      - entregas
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Frontend dependencies
        run: npm install

      - name: Frontend build
        run: npm run build

      - name: Backend dependencies
        working-directory: backend
        run: npm install

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Phase 0 commerce tests
        working-directory: backend
        run: npm test -- --runInBand classifieds-commerce-money.spec.ts classifieds-commerce-feature-flags.spec.ts
