name: Fix resume editor spacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-resume-spacing.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply resume spacing fix workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch resume editor normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/ResumeBuilderPage.tsx')
          text = path.read_text()
          replacements = {
              'role: String(stage.role || "").trim(),': 'role: String(stage.role || ""),',
              'company: String(exp.company || "").trim(),': 'company: String(exp.company || ""),',
              'const normalizedExperiences = formExperiences.map(syncExperience);': '''const normalizedExperiences = formExperiences.map((experience) => {
        const synced = syncExperience(experience);
        return {
          ...synced,
          company: synced.company.trim(),
          role: synced.role.trim(),
          description: String(synced.description || "").trim(),
          timeline: (synced.timeline || []).map((stage) => ({
            ...stage,
            role: String(stage.role || "").trim(),
            description: String(stage.description || "").trim(),
          })),
        };
      });''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/ResumeBuilderPage.tsx
          git commit -m 'fix: preserve spaces while editing resume fields'
          git push origin main
