name: Patch resume builder polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-builder-polish.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: patch resume builder polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch builder
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('pages/ResumeBuilderPage.tsx')
          text = path.read_text()

          def rep(old, new):
              global text
              if old not in text:
                  raise SystemExit(f'Expected source not found: {old[:140]}')
              text = text.replace(old, new, 1)

          rep('function mergeUniqueStrings(current: string[], incoming: unknown): string[] {', '''function enhanceProfessionalPhoto(dataUrl: string): Promise<string> {
  return new Promise((resolve) => {
    if (!dataUrl.startsWith("data:image/")) return resolve(dataUrl);
    const image = new Image();
    image.onload = () => {
      const maxDimension = 1400;
      const scale = Math.min(1, maxDimension / Math.max(image.width, image.height));
      const width = Math.max(1, Math.round(image.width * scale));
      const height = Math.max(1, Math.round(image.height * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      if (!context) return resolve(dataUrl);
      context.imageSmoothingEnabled = true;
      context.imageSmoothingQuality = "high";
      context.filter = "brightness(1.05) contrast(1.06) saturate(0.96)";
      context.drawImage(image, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.9));
    };
    image.onerror = () => resolve(dataUrl);
    image.src = dataUrl;
  });
}

function mergeUniqueStrings(current: string[], incoming: unknown): string[] {''')

          rep('  const { enabled: aiEnabled } = useAiStatus();', '  const { enabled: aiEnabled, resumeScorePaymentRequired } = useAiStatus();')
          rep('  const [formPhoto, setFormPhoto] = useState("");', '  const [formPhoto, setFormPhoto] = useState("");\n  const [professionalizePhoto, setProfessionalizePhoto] = useState(false);\n  const [photoEnhancing, setPhotoEnhancing] = useState(false);')
          rep('    setFormAiAnalysis(profile.resumeScoreUnlocked ? profile.aiAnalysis : undefined);', '''    setFormAiAnalysis(
      profile.resumeScoreUnlocked || !resumeScorePaymentRequired
        ? profile.aiAnalysis || undefined
        : undefined,
    );''')
          rep('  }, [profile]);\n\n  const recalcScale = useCallback(() => {', '''  }, [profile, resumeScorePaymentRequired]);

  const applyProfessionalPhoto = async (value: string) => {
    if (!value || !value.startsWith("data:image/")) {
      setFormPhoto(value);
      return;
    }
    setPhotoEnhancing(true);
    try {
      setFormPhoto(await enhanceProfessionalPhoto(value));
    } finally {
      setPhotoEnhancing(false);
    }
  };

  const handleResumePhotoChange = (value: string) => {
    if (!professionalizePhoto || !aiEnabled || !value.startsWith("data:image/")) {
      setFormPhoto(value);
      return;
    }
    void applyProfessionalPhoto(value);
  };

  const recalcScale = useCallback(() => {''')
          rep('    aiAnalysis: profile.resumeScoreUnlocked ? formAiAnalysis : undefined,', '''    aiAnalysis:
      profile.resumeScoreUnlocked || !resumeScorePaymentRequired
        ? formAiAnalysis
        : undefined,''')
          rep('''    if (aiEnabled && !profile.resumeScoreUnlocked) {
      setScoreOfferMessage("");
      setScoreOfferOpen(true);
      return;
    }''', '''    if (aiEnabled && !formAiAnalysis) {
      setScoreOfferMessage("");
      setScoreOfferOpen(true);
      return;
    }''')
          rep('''    if (!profile.resumeScoreUnlocked) {
      setScoreOfferMessage("");
      setScoreOfferOpen(true);
      return undefined;
    }''', '''    if (resumeScorePaymentRequired && !profile.resumeScoreUnlocked) {
      setScoreOfferMessage("");
      setScoreOfferOpen(true);
      return undefined;
    }''')
          rep('''  const handleScoreInterest = () => {
    if (profile.resumeScoreUnlocked) {
      setScoreOfferOpen(false);
      setStep(99);
      void reviewResume();
      return;
    }
    setScoreOfferMessage(
      "A etapa de pagamento será conectada a este botão. Seu currículo continua gratuito e disponível normalmente enquanto isso.",
    );
  };''', '''  const handleScoreInterest = () => {
    if (!resumeScorePaymentRequired || profile.resumeScoreUnlocked) {
      setScoreOfferOpen(false);
      setScoreOfferMessage("");
      setStep(99);
      void reviewResume();
      return;
    }
    setScoreOfferMessage(
      "A etapa de pagamento será conectada a este botão. Seu currículo continua gratuito e disponível normalmente enquanto isso.",
    );
  };''')
          rep('                  unlocked={Boolean(profile.resumeScoreUnlocked)}', '                  unlocked={Boolean(formAiAnalysis || profile.resumeScoreUnlocked)}')
          rep('''              <p className="text-xs text-stone-500 mb-3">Ela pode ser diferente da foto do seu perfil.</p>
              <div className="flex items-start gap-4">
                <div className="flex-1 max-w-sm">
                  <FileUpload label="" accept="image/*" value={formPhoto} onChange={setFormPhoto} type="avatar" placeholder="Clique para subir uma foto profissional" />
                </div>''', '''              <p className="text-xs text-stone-500 mb-3">Ela pode ser diferente da foto do seu perfil.</p>
              {aiEnabled && (
                <label className="mb-3 flex cursor-pointer items-start gap-3 rounded-2xl border border-violet-100 bg-violet-50/60 p-3.5">
                  <input
                    type="checkbox"
                    checked={professionalizePhoto}
                    onChange={(event) => {
                      const checked = event.target.checked;
                      setProfessionalizePhoto(checked);
                      if (checked && formPhoto.startsWith("data:image/")) void applyProfessionalPhoto(formPhoto);
                    }}
                    className="mt-0.5 h-4 w-4 rounded border-violet-300 text-violet-600 focus:ring-violet-500"
                  />
                  <span>
                    <strong className="block text-sm text-violet-950">Deixar a foto mais profissional</strong>
                    <span className="mt-0.5 block text-xs leading-relaxed text-violet-700">Ajusta automaticamente luz, contraste, definição e tamanho sem mudar seu rosto.</span>
                  </span>
                </label>
              )}
              {photoEnhancing && (
                <div className="mb-3 flex items-center gap-2 text-xs font-medium text-violet-700">
                  <Loader2 className="h-3.5 w-3.5 animate-spin" /> Preparando uma versão mais profissional da foto...
                </div>
              )}
              <div className="flex items-start gap-4">
                <div className="flex-1 max-w-sm">
                  <FileUpload label="" accept="image/*" value={formPhoto} onChange={handleResumePhotoChange} type="avatar" placeholder="Clique para subir ou tirar uma foto" />
                </div>''')

          path.write_text(text)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages/ResumeBuilderPage.tsx
          git rm .github/workflows/resume-builder-polish.yml
          git commit -m 'feat: add professional photo option and free score flow'
          git push origin main
