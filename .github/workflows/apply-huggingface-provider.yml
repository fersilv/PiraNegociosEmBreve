name: Apply Hugging Face provider

on:
  push:
    branches:
      - pagamentos
    paths:
      - .github/huggingface-provider.trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pagamentos
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Apply provider integration
        run: node .github/scripts/apply-huggingface-provider.cjs
      - name: Refresh backend lockfile
        working-directory: backend
        run: npm install --package-lock-only
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit generated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat(ai): add Hugging Face provider for text and image"
          git push origin HEAD:pagamentos
