name: Generate brand assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_brand_assets.py'
      - '.github/workflows/generate-brand-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Generate transparent PNG assets
        run: python scripts/generate_brand_assets.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/logos
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate PiraNegócios transparent logo assets"
            git push
          fi
